on:
  workflow_call:

env:
  HELM_VERSION_TO_INSTALL: 3.17.1
  # The helm-schema hook's rev in .pre-commit-config.yaml does not select a
  # generator version - the hook shells out to this plugin - so this is the
  # real pin. Keep the two equal.
  SCHEMA_PLUGIN_VERSION: v2.6.0

jobs:
  run:
    runs-on: "ubuntu-latest"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install helm
        uses: Azure/setup-helm@v3
        with:
          version: ${{ env.HELM_VERSION_TO_INSTALL }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          # Pin a specific version of uv.
          version: "0.8.22"

      - name: Install helm plugins
        run: helm plugin install https://github.com/losisin/helm-values-schema-json.git --version ${{ env.SCHEMA_PLUGIN_VERSION }}

      - name: Run pre-commit
        run: |
          uvx pre-commit run --all-files --show-diff-on-failure
