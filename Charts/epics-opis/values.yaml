# yaml-language-server: $schema=values.schema.json

# use nginx for publishing opi files over http
image: nginx:1.25.4
# resources for the nginx container. nginx serving static OPI files is nearly
# idle, so these can be lowered where a namespace has a tight CPU/memory quota
resources:
  requests:
    memory: 100Mi
    cpu: 200m
  limits:
    memory: 500Mi
    cpu: 600m
# Short name for this collection of services
domain:
# location where these IOCs and services will run
location:
# networking for the Service that exposes the OPI files over http
service:
  # LoadBalancer, ClusterIP or NodePort
  # @schema enum: ["LoadBalancer", "ClusterIP", "NodePort"]
  type: LoadBalancer
  # pin a specific address when the LoadBalancer provider supports it
  # @schema type: ["string", "null"]
  loadBalancerIP:
  # route traffic arriving on these node/external addresses to the service
  # (works without any LoadBalancer provider, typically with type: ClusterIP)
  externalIPs: []
  #  - 192.168.1.100
  # @schema additionalProperties: {"type":"string"}
  annotations: {}
