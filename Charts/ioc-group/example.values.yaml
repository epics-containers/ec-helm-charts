# examples of objects in values.yaml that default to empty and have no K8S schema
# used for generating schema for these objects
# see .schema.config.yaml

# Every entry must supply NAME. The remaining keys are free-form environment
# variable names, so unlike the other charts' fixed-shape objects this item
# must stay open. There is no way to annotate additionalProperties on an
# array item that also declares real keys (losisin/helm-values-schema-json#103),
# so a second, empty example item carries that annotation on its own; the
# generator merges the two example items into one items schema.
iocs:
  - {} # @schema additionalProperties: true
  - NAME: "01" # @schema required
