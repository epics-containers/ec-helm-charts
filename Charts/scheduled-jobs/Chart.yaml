# Run a container image on a schedule.
#
# A service that depends on this chart gets one CronJob per entry in `jobs`.
# All jobs in a service share one image and one schedule, and run in parallel.

apiVersion: v2
name: scheduled-jobs
description: |
  Run a container image on a schedule, as one or more parallel CronJobs

# version is replaced with git tag by the CI
version: 1.0.0

type: application
home: https://github.com/epics-containers/ec-helm-charts
sources:
  - https://github.com/epics-containers/ec-helm-charts/tree/main/Charts/scheduled-jobs
maintainers:
  - name: epics-containers
    url: https://epics-containers.github.io
