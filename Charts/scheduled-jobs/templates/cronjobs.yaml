{{- /*
One CronJob per entry in .Values.jobs. All share the service image and schedule.
*/ -}}

{{- $image := .Values.image | required "ERROR - You must supply image" -}}
{{- $schedule := .Values.schedule | required "ERROR - You must supply schedule" -}}
{{- $enabled := eq .Values.global.enabled false | ternary false true -}}

{{- range $jobName, $job := .Values.jobs }}
{{- $job = $job | default dict }}

{{- $deadline := hasKey $job "activeDeadlineSeconds" | ternary $job.activeDeadlineSeconds $.Values.activeDeadlineSeconds }}
{{- $labels := dict "app" $.Release.Name "job" $jobName "scheduled-job" "true" }}
{{- $labels = merge $labels ($.Values.global.labels | default dict) }}

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $.Release.Name }}-{{ $jobName }}
  labels:
    {{- toYaml $labels | nindent 4 }}
spec:
  schedule: {{ $schedule | quote }}
  {{- with $.Values.timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  suspend: {{ not $enabled }}
  # a slow run must never overlap the next one
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 7
  jobTemplate:
    metadata:
      labels:
        {{- toYaml $labels | nindent 8 }}
    spec:
      # a failed run is a result to report, not something to retry
      backoffLimit: 0
      {{- if $deadline }}
      activeDeadlineSeconds: {{ $deadline | int64 }}
      {{- end }}
      template:
        metadata:
          labels:
            {{- toYaml $labels | nindent 12 }}
        spec:
          restartPolicy: Never
          {{- if $.Values.hostNetwork }}
          hostNetwork: true
          dnsPolicy: ClusterFirstWithHostNet
          {{- end }}
          {{- with $.Values.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $.Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $.Values.volumes }}
          volumes:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: {{ $jobName }}
              image: {{ $image }}
              imagePullPolicy: {{ $.Values.imagePullPolicy }}
              {{- with $job.args }}
              args:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              # later entries win, so a job can override a service-level value
              env:
                - name: JOB_NAME
                  value: {{ $jobName | quote }}
                {{- with $.Values.global.env }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
                {{- with $.Values.env }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
                {{- with $job.env }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
              {{- with $.Values.volumeMounts }}
              volumeMounts:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- with $.Values.securityContext }}
              securityContext:
                {{- toYaml . | nindent 16 }}
              {{- end }}
{{- end }}
